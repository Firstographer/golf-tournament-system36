<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golf Tournament System | System 36</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f5f7f5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 4px; }
    .glass-modal { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDQBlalacBZgVgCRTlUVvNtvQuUBBCnY8U",
      authDomain: "measot-golf.firebaseapp.com",
      databaseURL: "https://measot-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "measot-golf",
      storageBucket: "measot-golf.firebasestorage.app",
      messagingSenderId: "339301101563",
      appId: "1:339301101563:web:680bcdb8d8f77717c6655e",
      measurementId: "G-XNRCCT88BX"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const COURSE_PRESETS = {
      'Gassan': { name: 'Gassan Legacy Golf Club', pars: [5, 3, 5, 4, 4, 4, 3, 5, 4, 5, 4, 3, 4, 4, 3, 4, 5, 3] },
      'Bhumibol': { name: 'เขื่อนภูมิพล (Bhumibol Dam Golf Course)', pars: [5, 3, 3, 4, 4, 5, 4, 3, 5, 4, 3, 3, 4, 4, 5, 5, 4, 4] }
    };

    const DEFAULT_RULES = { albatross: 5, eagle: 4, birdie: 3, par: 2, bogey: 1, doubleBogey: 0 };

    const getStablefordPoints = (score, par, rules) => {
      if (!score || score === 0 || score === '') return 0;
      const overPar = score - par;
      if (overPar <= -3) return rules.albatross ?? 5;
      if (overPar === -2) return rules.eagle ?? 4;
      if (overPar === -1) return rules.birdie ?? 3;
      if (overPar === 0) return rules.par ?? 2;
      if (overPar === 1) return rules.bogey ?? 1;
      return rules.doubleBogey ?? 0;
    };

    const getScoreColorClass = (score, par) => {
      if (!score || score === 0) return 'text-gray-900 bg-gray-50 border-gray-300';
      if (score < par) return 'text-[#d4af37] bg-yellow-50 border-yellow-300';
      if (score === par) return 'text-emerald-600 bg-emerald-50 border-emerald-300';
      if (score > par) return 'text-gray-500 bg-gray-100 border-gray-300';
      return 'text-gray-900 bg-gray-50 border-gray-300';
    };

    const calculatePlayerStats = (player, eventPars, rules) => {
      let grossScore = 0; let stablefordPoints = 0; let holesPlayed = 0;
      const scores = player.scores || Array(18).fill(0);

      scores.forEach((score, index) => {
        if (score > 0) {
          grossScore += parseInt(score);
          stablefordPoints += getStablefordPoints(parseInt(score), eventPars[index], rules);
          holesPlayed++;
        }
      });

      const handicap = holesPlayed === 18 ? 36 - stablefordPoints : 0;
      const netScore = holesPlayed === 18 ? grossScore - handicap : 0;

      let group = 'None';
      if (player.gender === 'Lady') group = 'Lady';
      else if (player.isSenior) group = 'Senior';
      else {
        if (holesPlayed === 18) {
          if (handicap <= 9) group = 'A';
          else if (handicap <= 18) group = 'B';
          else group = 'C';
        } else { group = 'Pending'; }
      }
      return { ...player, scores, grossScore, stablefordPoints, handicap, netScore, group, holesPlayed };
    };

    const comparePlayers = (a, b) => {
      if (a.holesPlayed < 18 && b.holesPlayed === 18) return 1;
      if (b.holesPlayed < 18 && a.holesPlayed === 18) return -1;
      if (a.netScore !== b.netScore) return a.netScore - b.netScore; 
      for (let i = 17; i >= 0; i--) {
        const scoreA = a.scores[i] || 0;
        const scoreB = b.scores[i] || 0;
        if (scoreA !== scoreB) return scoreA - scoreB;
      }
      return b.stablefordPoints - a.stablefordPoints; 
    };

    function App() {
      const [events, setEvents] = useState({});
      const [currentEventId, setCurrentEventId] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [pin, setPin] = useState('');
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [showRulesModal, setShowRulesModal] = useState(false);

      const [newEventData, setNewEventData] = useState({ name: '', date: '', pars: Array(18).fill(4), rules: { ...DEFAULT_RULES } });
      const [selectedPreset, setSelectedPreset] = useState('');
      const [editingRules, setEditingRules] = useState(null);

      const [activeTab, setActiveTab] = useState('ALL');
      const [viewScorecard, setViewScorecard] = useState(null);
      const [newPlayer, setNewPlayer] = useState({ name: '', gender: 'Men', isSenior: false });
      const [adminSort, setAdminSort] = useState({ key: 'default', direction: 'asc' });

      const [mockupDate, setMockupDate] = useState('2026-11-01');
      // ตั้งค่าให้เปิดมาเจอ Leaderboard เสมอ แม้ตอนล็อกอินเสร็จ
      const [adminViewMode, setAdminViewMode] = useState('leaderboard');
      const [editingPlayer, setEditingPlayer] = useState(null);

      useEffect(() => {
        const eventsRef = db.ref('events');
        eventsRef.on('value', (snapshot) => {
          setEvents(snapshot.val() || {});
        });
        return () => eventsRef.off();
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pin === '1234') {
          setIsAdmin(true); setShowLoginModal(false); setPin('');
        } else { alert('รหัส PIN ไม่ถูกต้อง!'); }
      };

      const handlePresetChange = (e) => {
        const val = e.target.value;
        setSelectedPreset(val);
        if (COURSE_PRESETS[val]) {
          setNewEventData({ ...newEventData, name: COURSE_PRESETS[val].name, pars: [...COURSE_PRESETS[val].pars] });
        } else {
          setNewEventData({ ...newEventData, name: '', pars: Array(18).fill(4) });
        }
      };

      const handleCreateEvent = (e) => {
        e.preventDefault();
        if (!newEventData.name || !newEventData.date) { alert('กรุณากรอกข้อมูลให้ครบ'); return; }
        
        const btn = document.getElementById('btn-save-event');
        if (btn) btn.innerText = 'กำลังเชื่อมต่อ...';

        const newEventRef = db.ref('events').push();
        newEventRef.set({
          id: newEventRef.key, name: newEventData.name, date: newEventData.date, pars: newEventData.pars, 
          rules: newEventData.rules, players: {}
        }).then(() => {
          setShowCreateModal(false);
          setNewEventData({ name: '', date: '', pars: Array(18).fill(4), rules: { ...DEFAULT_RULES } });
          setSelectedPreset('');
          if (btn) btn.innerText = 'Save Event';
        }).catch(err => {
          alert("❌ บันทึกไม่ได้: " + err.message);
          if (btn) btn.innerText = 'Save Event';
        });
      };

      const generateMockupEvent = () => {
        if(!window.confirm(`ยืนยันการสร้าง Mockup Event 60 คน?`)) return;
        const newEventRef = db.ref('events').push();
        const pars = COURSE_PRESETS['Gassan'].pars;
        const mockPlayers = {};
        for(let i=1; i<=60; i++) {
          const pId = 'mock_p_' + i + '_' + Date.now();
          const gender = Math.random() > 0.85 ? 'Lady' : 'Men';
          const targetGross = Math.floor(Math.random() * (100 - 75 + 1)) + 75;
          let scores = [...pars];
          let currentGross = 72;
          
          for(let j=0; j<Math.floor(Math.random()*3); j++) {
             const idx = Math.floor(Math.random() * 18);
             if (scores[idx] > pars[idx] - 1 && scores[idx] > 2) { scores[idx] -= 1; currentGross -= 1; }
          }
          while (currentGross < targetGross) {
             const idx = Math.floor(Math.random() * 18);
             if (scores[idx] < pars[idx] * 2) { scores[idx] += 1; currentGross += 1; }
          }
          mockPlayers[pId] = { id: pId, name: `นักกอล์ฟคนที่ ${i}`, gender: gender, isSenior: gender === 'Men' && Math.random() > 0.85, scores: scores };
        }

        newEventRef.set({
          id: newEventRef.key, name: 'Gassan Legacy (Mockup Event 60 Pax)', date: mockupDate, pars: pars, 
          rules: { ...DEFAULT_RULES }, players: mockPlayers
        }).then(() => { alert('✅ สร้างข้อมูลจำลองสำเร็จ!'); });
      };

      const addPlayer = (e) => {
        e.preventDefault();
        if (!newPlayer.name) return;
        const ev = events[currentEventId];
        const playerRef = db.ref(`events/${currentEventId}/players`).push();
        playerRef.set({
          id: playerRef.key, name: newPlayer.name, gender: newPlayer.gender,
          isSenior: newPlayer.gender === 'Lady' ? false : newPlayer.isSenior, scores: [...ev.pars]
        }).then(() => { setNewPlayer({ name: '', gender: 'Men', isSenior: false }); });
      };

      const updatePlayerInfo = (e) => {
        e.preventDefault();
        db.ref(`events/${currentEventId}/players/${editingPlayer.id}`).update({
          name: editingPlayer.name, gender: editingPlayer.gender, isSenior: editingPlayer.gender === 'Lady' ? false : editingPlayer.isSenior
        }).then(() => { setEditingPlayer(null); });
      };

      const updateScore = (playerId, holeIndex, value) => {
        if (value === '') {
          db.ref(`events/${currentEventId}/players/${playerId}/scores/${holeIndex}`).set('');
          return;
        }
        let val = parseInt(value) || 0;
        if (val > 20) val = 20; 
        db.ref(`events/${currentEventId}/players/${playerId}/scores/${holeIndex}`).set(val);
      };

      const saveRules = (e) => {
        e.preventDefault();
        db.ref(`events/${currentEventId}/rules`).set(editingRules).then(() => {
          setShowRulesModal(false);
        });
      };

      const saveImage = (name) => {
        const target = document.getElementById('leaderboard-capture');
        if (!target) return;
        const originalStyle = target.style.cssText;
        target.style.background = '#ffffff'; target.style.boxShadow = 'none';
        html2canvas(target, { backgroundColor: '#ffffff', scale: 2, useCORS: true }).then(canvas => {
          target.style.cssText = originalStyle;
          const link = document.createElement('a'); link.download = `${name}-Leaderboard.png`;
          link.href = canvas.toDataURL('image/png'); link.click();
        }).catch(() => { target.style.cssText = originalStyle; });
      };

      const getRankIcon = (rankNum, rankStr) => {
        if (rankNum === 1) return <div className="flex items-center justify-center gap-1.5"><i className="fas fa-trophy text-[#d4af37] text-lg md:text-xl drop-shadow-sm"></i><span className="text-xs font-extrabold text-[#d4af37]">{rankStr}</span></div>;
        if (rankNum === 2) return <div className="flex items-center justify-center gap-1.5"><i className="fas fa-trophy text-[#a0a0a0] text-lg md:text-xl drop-shadow-sm"></i><span className="text-xs font-extrabold text-[#909090]">{rankStr}</span></div>;
        if (rankNum === 3) return <div className="flex items-center justify-center gap-1.5"><i className="fas fa-trophy text-[#cd7f32] text-lg md:text-xl drop-shadow-sm"></i><span className="text-xs font-extrabold text-[#b87333]">{rankStr}</span></div>;
        return rankStr;
      };

      const renderNineHoles = (startIndex, endIndex, title, eventPars, eventRules) => {
        const slicedPars = eventPars.slice(startIndex, endIndex);
        const slicedScores = viewScorecard.scores.slice(startIndex, endIndex);
        return (
          <div className="overflow-x-auto hide-scroll rounded-xl border mb-4 shadow-sm">
            <table className="w-full text-center text-xs md:text-sm border-collapse min-w-max">
              <tbody>
                <tr className="bg-emerald-900 text-white">
                  <td className="p-1.5 md:p-2 border border-emerald-800 font-bold whitespace-nowrap px-3">{title}</td>
                  {slicedPars.map((_,i) => <td key={i} className="p-1.5 md:p-2 border border-emerald-800 w-8 md:w-10">{startIndex + i + 1}</td>)}
                </tr>
                <tr className="bg-gray-100 font-bold text-emerald-900">
                  <td className="p-1.5 md:p-2 border border-gray-300 whitespace-nowrap">Par</td>
                  {slicedPars.map((par, i) => <td key={i} className="p-1.5 md:p-2 border border-gray-300">{par}</td>)}
                </tr>
                <tr>
                  <td className="p-1.5 md:p-2 border border-gray-200 font-bold whitespace-nowrap">Score</td>
                  {slicedScores.map((score, i) => <td key={i} className={`p-1.5 md:p-2 border border-gray-200 font-mono font-bold text-sm md:text-base ${score>0 ? (score<slicedPars[i] ? 'text-red-600 bg-red-50' : score>slicedPars[i] ? 'text-blue-600 bg-blue-50' : '') : ''}`}>{score || '-'}</td>)}
                </tr>
                <tr className="bg-[#fdfbf7]">
                  <td className="p-1.5 md:p-2 border border-[#d4af37]/30 font-bold text-[#9c7e1c] text-[10px] md:text-xs whitespace-nowrap">Pts</td>
                  {slicedScores.map((score, i) => <td key={i} className="p-1.5 md:p-2 border border-[#d4af37]/30 font-mono font-bold text-[#d4af37] text-xs md:text-sm">{score>0 ? getStablefordPoints(score, slicedPars[i], eventRules) : '-'}</td>)}
                </tr>
              </tbody>
            </table>
          </div>
        );
      };

      const event = currentEventId ? events[currentEventId] : null;
      let displayPlayers = []; let rankedPlayers = []; let adminPlayers = []; let totalPar = 0; let activeRules = DEFAULT_RULES;

      if (event) {
        totalPar = event.pars.reduce((a, b) => a + b, 0);
        activeRules = event.rules || DEFAULT_RULES;
        
        const rawPlayers = event.players ? Object.values(event.players) : [];
        const processedPlayers = rawPlayers.map(p => calculatePlayerStats(p, event.pars, activeRules));
        
        displayPlayers = [...processedPlayers];
        if (activeTab !== 'ALL') displayPlayers = displayPlayers.filter(p => p.group === activeTab);
        displayPlayers.sort(comparePlayers);

        let currentRankNum = 1;
        rankedPlayers = displayPlayers.map((p, i) => {
          if (p.holesPlayed < 18) return { ...p, rankNum: 999, rankStr: '-' };
          let isTieWithPrev = false; let isTieWithNext = false;
          if (i > 0 && comparePlayers(p, displayPlayers[i-1]) === 0) { isTieWithPrev = true; } else { currentRankNum = i + 1; }
          if (i < displayPlayers.length - 1 && comparePlayers(p, displayPlayers[i+1]) === 0) { isTieWithNext = true; }
          return { ...p, rankNum: currentRankNum, rankStr: (isTieWithPrev || isTieWithNext) ? `T${currentRankNum}` : `${currentRankNum}` };
        });

        adminPlayers = [...processedPlayers];
        if (adminSort.key !== 'default') {
          adminPlayers.sort((a, b) => {
            let valA, valB;
            if (adminSort.key === 'name') { valA = a.name; valB = b.name; }
            else if (adminSort.key === 'tot') { valA = a.grossScore; valB = b.grossScore; }
            else if (adminSort.key.startsWith('H')) { const idx = parseInt(adminSort.key.replace('H', '')) - 1; valA = a.scores[idx] || 0; valB = b.scores[idx] || 0; }
            if (valA < valB) return adminSort.direction === 'asc' ? -1 : 1;
            if (valA > valB) return adminSort.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }
      }

      return (
        <div className="min-h-screen relative pb-10">
          <header className="bg-emerald-900 text-white shadow-md border-b-4 border-[#d4af37]">
            <div className="max-w-7xl mx-auto px-4 py-4 relative flex items-center justify-between">
              {currentEventId ? (
                <button onClick={() => setCurrentEventId(null)} className="text-emerald-300 hover:text-white font-bold whitespace-nowrap text-sm md:text-base flex items-center"><i className="fas fa-arrow-left mr-1 md:mr-2"></i><span className="hidden md:inline">Back</span></button>
              ) : (
                <div className="w-16"></div> 
              )}
              
              <div className="flex-grow text-center mx-2 overflow-hidden">
                {currentEventId ? (
                  <h1 className="text-lg md:text-2xl font-bold text-[#fdfbf7] truncate">{event.name}</h1>
                ) : (
                  <div>
                    <i className="fas fa-trophy text-3xl md:text-5xl text-[#d4af37] mb-2"></i>
                    <h1 className="text-2xl md:text-4xl font-bold tracking-wide text-[#fdfbf7]">Golf Tournament</h1>
                  </div>
                )}
              </div>
              
              <div className="flex items-center gap-1 md:gap-2">
                {currentEventId && isAdmin && (
                  <button onClick={() => setAdminViewMode(adminViewMode === 'entry' ? 'leaderboard' : 'entry')} className="text-[10px] md:text-xs bg-amber-500 text-emerald-950 font-bold px-2 md:px-3 py-1.5 rounded-full shadow hover:bg-amber-400 transition-colors whitespace-nowrap">
                    <i className={`fas ${adminViewMode === 'entry' ? 'fas fa-trophy' : 'fas fa-edit'} md:mr-1`}></i><span className="hidden md:inline">{adminViewMode === 'entry' ? 'View Leaderboard' : 'Score Entry'}</span>
                  </button>
                )}
                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)} className="text-[10px] md:text-xs text-emerald-300 hover:text-white bg-emerald-800 px-2 md:px-3 py-1.5 rounded-full transition-colors flex-shrink-0 whitespace-nowrap">
                  <i className={`fas ${isAdmin ? 'fa-sign-out-alt' : 'fa-lock'} md:mr-1`}></i><span className="hidden md:inline">{isAdmin ? 'Exit Admin' : 'Admin Login'}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-2 md:px-4 py-6 md:py-8">
            
            {!currentEventId && (
              <div className="max-w-5xl mx-auto">
                {isAdmin && (
                  <div className="flex flex-col md:flex-row justify-between items-center mb-8 bg-emerald-50 p-4 rounded-xl border border-emerald-100 gap-4">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-emerald-900">วันที่ Mockup:</span>
                      <input type="date" value={mockupDate} onChange={(e) => setMockupDate(e.target.value)} className="border p-2 rounded-lg text-sm bg-white" />
                      <button onClick={generateMockupEvent} className="bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-emerald-800 shadow whitespace-nowrap">
                        <i className="fas fa-magic mr-1"></i> สร้าง Mockup
                      </button>
                    </div>
                    <button onClick={() => setShowCreateModal(true)} className="flex items-center space-x-2 bg-[#d4af37] text-emerald-950 px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-[#b5952f] w-full md:w-auto justify-center">
                      <i className="fas fa-plus"></i><span>สร้างการแข่งขันใหม่</span>
                    </button>
                  </div>
                )}
                <h2 className="text-2xl font-bold text-emerald-900 mb-6 border-b-2 border-emerald-200 pb-2"><i className="fas fa-calendar-check mr-2 text-[#d4af37]"></i> All Tournaments</h2>
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {Object.keys(events).length === 0 ? (
                    <div className="col-span-full text-center p-12 bg-white rounded-xl border border-dashed border-gray-300 text-gray-500">
                      <i className="fas fa-golf-ball text-4xl text-gray-300 mb-3"></i><br/>ไม่มีรายการแข่งขัน สร้างใหม่เพื่อเริ่มต้น
                    </div>
                  ) : Object.values(events).sort((a,b) => new Date(b.date) - new Date(a.date)).map(e => (
                    <div key={e.id} className="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden hover:shadow-xl transition-shadow flex flex-col">
                      <div className="bg-emerald-900 p-4 border-b border-[#d4af37]"><h3 className="text-lg font-bold text-white truncate" title={e.name}>{e.name}</h3></div>
                      <div className="p-4 flex-grow space-y-3">
                        <p className="text-sm text-gray-600 font-medium"><i className="fas fa-calendar-alt w-5 text-emerald-700"></i> {e.date ? e.date.split('-').reverse().join('/') : ''}</p>
                        <p className="text-sm text-gray-600 font-medium"><i className="fas fa-users w-5 text-emerald-700"></i> {Object.keys(e.players || {}).length} Players</p>
                      </div>
                      <div className="p-4 bg-gray-50 border-t border-gray-100 flex space-x-2">
                        <button onClick={() => setCurrentEventId(e.id)} className="flex-grow bg-emerald-700 text-white font-bold py-2 rounded-lg hover:bg-emerald-800 shadow">Enter Event</button>
                        {isAdmin && <button onClick={() => { if(window.confirm('Delete Event?')) db.ref(`events/${e.id}`).remove() }} className="bg-red-50 text-red-600 px-3 py-2 rounded-lg border border-red-200 hover:bg-red-100"><i className="fas fa-trash-alt"></i></button>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentEventId && (!isAdmin || adminViewMode === 'leaderboard') && (
              <div>
                <div className="flex justify-center gap-2 mb-6 flex-wrap">
                  {['ALL', 'A', 'B', 'C', 'Senior', 'Lady'].map(tab => (
                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-1.5 md:px-5 md:py-2 rounded-full text-xs md:text-sm font-bold border transition-all ${activeTab === tab ? 'bg-emerald-800 text-white border-emerald-900 shadow-md' : 'bg-white text-emerald-800 border-emerald-200'}`}>
                      {tab === 'ALL' ? 'Overall' : tab === 'Senior' || tab === 'Lady' ? tab : `Group ${tab}`}
                    </button>
                  ))}
                </div>
                
                <div id="leaderboard-capture" className="bg-white rounded-xl shadow-lg overflow-hidden pb-4 border border-gray-200">
                  <div className="bg-emerald-900 text-white p-3 md:p-4 text-center border-b border-[#d4af37] relative">
                    <h2 className="text-lg md:text-xl font-bold">{activeTab === 'ALL' ? 'Leaderboard - Overall' : activeTab === 'Senior' || activeTab === 'Lady' ? `Leaderboard - ${activeTab}` : `Leaderboard - Group ${activeTab}`}</h2>
                    <p className="text-xs md:text-sm text-emerald-200 mb-1">System 36 Format</p>

      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
