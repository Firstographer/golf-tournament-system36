    const getCoursePars = (course) => {
      if (!course) return Array(18).fill(4);
      if (course.pars && Array.isArray(course.pars)) return course.pars;
      if (course.holes && Array.isArray(course.holes)) {
        return course.holes.map(h => typeof h === 'object' ? h.par : h);
      }
      return Array(18).fill(4);
    };

    const DEFAULT_RULES = { albatross: 5, eagle: 4, birdie: 3, par: 2, bogey: 1, doubleBogey: 0 };

    const getStablefordPoints = (score, par, rules) => {
      if (!score || score === 0 || score === '') return 0;
      const overPar = score - par;
      if (overPar <= -3) return rules.albatross ?? 5;
      if (overPar === -2) return rules.eagle ?? 4;
      if (overPar === -1) return rules.birdie ?? 3;
      if (overPar === 0) return rules.par ?? 2;
      if (overPar === 1) return rules.bogey ?? 1;
      return rules.doubleBogey ?? 0;
    };

    const getScoreColorClass = (score, par) => {
      if (!score || score === 0) return 'text-gray-900 bg-gray-50 border-gray-300';
      if (score < par) return 'text-[#d4af37] bg-yellow-50 border-yellow-300';
      if (score === par) return 'text-emerald-600 bg-emerald-50 border-emerald-300';
      if (score > par) return 'text-gray-500 bg-gray-100 border-gray-300';
      return 'text-gray-900 bg-gray-50 border-gray-300';
    };

    const calculatePlayerStats = (player, eventPars, rules) => {
      let grossScore = 0; let stablefordPoints = 0; let holesPlayed = 0;
      const scores = player.scores || Array(18).fill(0);

      scores.forEach((score, index) => {
        if (score > 0) {
          grossScore += parseInt(score);
          stablefordPoints += getStablefordPoints(parseInt(score), eventPars[index], rules);
          holesPlayed++;
        }
      });

      const handicap = holesPlayed === 18 ? 36 - stablefordPoints : 0;
      const netScore = holesPlayed === 18 ? grossScore - handicap : 0;

      let group = 'None';
      if (player.gender === 'Lady') group = 'Lady';
      else if (player.isSenior) group = 'Senior';
      else {
        if (holesPlayed === 18) {
          if (handicap <= 9) group = 'A';
          else if (handicap <= 18) group = 'B';
          else group = 'C';
        } else { group = 'Pending'; }
      }
      return { ...player, scores, grossScore, stablefordPoints, handicap, netScore, group, holesPlayed };
    };

    const comparePlayers = (a, b) => {
      if (a.holesPlayed < 18 && b.holesPlayed === 18) return 1;
      if (b.holesPlayed < 18 && a.holesPlayed === 18) return -1;
      if (a.netScore !== b.netScore) return a.netScore - b.netScore; 
      for (let i = 17; i >= 0; i--) {
        const scoreA = a.scores[i] || 0;
        const scoreB = b.scores[i] || 0;
        if (scoreA !== scoreB) return scoreA - scoreB;
      }
      return b.stablefordPoints - a.stablefordPoints; 
    };

    // แก้ไขฟังก์ชัน Capture Image ให้เคลียร์พื้นที่และกำหนดขนาด Canvas ให้เรนเดอร์ตัวหนังสือภาษาไทยไม่ถูกบีบ
    const captureImage = (elementId, fileName) => {
      const target = document.getElementById(elementId);
      if (!target) return;
      
      const originalScrollLeft = target.scrollLeft;
      target.scrollLeft = 0; 

      const originalStyle = target.style.cssText;
      const targetWidth = Math.max(target.scrollWidth, 600); // กำหนดความกว้างขั้นต่ำไม่ให้ต่ำกว่า 600px เพื่อให้ชื่อไม่ถูกตัด

      target.style.width = targetWidth + 'px'; 
      target.style.maxWidth = 'none'; 
      target.style.background = '#ffffff'; 
      target.style.boxShadow = 'none';
      
      html2canvas(target, { 
        backgroundColor: '#ffffff', 
        scale: 2, 
        useCORS: true,
        windowWidth: targetWidth + 50
      }).then(canvas => {
        target.style.cssText = originalStyle;
        target.scrollLeft = originalScrollLeft;

        const link = document.createElement('a'); 
        link.download = `${fileName}.png`;
        link.href = canvas.toDataURL('image/png'); 
        link.click();
      }).catch(err => { 
        console.error("Capture failed:", err);
        target.style.cssText = originalStyle; 
        target.scrollLeft = originalScrollLeft;
      });
    };

        if (!newEventData.date) { alert('กรุณาระบุวันที่จัดงาน'); return; }
        
        const btn = document.getElementById('btn-save-event');
        if (btn) btn.innerText = 'กำลังเชื่อมต่อ...';

        const finalRules = {};
        for (const key in newEventData.rules) {
          finalRules[key] = parseInt(newEventData.rules[key]) || 0;
        }

        const newEventRef = db.ref('events').push();
        newEventRef.set({
          id: newEventRef.key, 
          name: finalEventName,
          courseName: finalCourseName, 
          date: newEventData.date, 
          pars: newEventData.pars, 
          rules: finalRules, 
          players: {}
        }).then(() => {
          setShowCreateModal(false);
          setNewEventData({ eventName: '', courseName: '', date: '', pars: Array(18).fill(4), rules: { ...DEFAULT_RULES } });
          setCourseSearch('');
          setIsCustomCourse(false);
          setSelectedProvinceFilter('ALL');
          if (btn) btn.innerText = 'Save Event';
        }).catch(err => {
          alert("❌ บันทึกไม่ได้: " + err.message);
          if (btn) btn.innerText = 'Save Event';
        });
      };

      const generateMockupEvent = () => {
        if(!window.confirm(`ยืนยันการสร้าง Mockup Event 60 คน?`)) return;
        const newEventRef = db.ref('events').push();
        const pars = getCoursePars(GOLF_COURSES_DB[0]);
        const mockPlayers = {};
        for(let i=1; i<=60; i++) {
          const pId = 'mock_p_' + i + '_' + Date.now();
          const gender = Math.random() > 0.85 ? 'Lady' : 'Men';
          const targetGross = Math.floor(Math.random() * (100 - 75 + 1)) + 75;
          let scores = [...pars];
          let currentGross = 72;
          
          for(let j=0; j<Math.floor(Math.random()*3); j++) {
             const idx = Math.floor(Math.random() * 18);
             if (scores[idx] > pars[idx] - 1 && scores[idx] > 2) { scores[idx] -= 1; currentGross -= 1; }
          }
          while (currentGross < targetGross) {
             const idx = Math.floor(Math.random() * 18);
             if (scores[idx] < pars[idx] * 2) { scores[idx] += 1; currentGross += 1; }
          }
          mockPlayers[pId] = { id: pId, name: `นักกอล์ฟคนที่ ${i}`, gender: gender, isSenior: gender === 'Men' && Math.random() > 0.85, scores: scores };
        }

        newEventRef.set({
          id: newEventRef.key, 
          name: 'การแข่งขันประจำเดือน (Mockup Event)',
          courseName: 'Gassan Legacy Golf Club',
          date: mockupDate, 
          pars: pars, 
          rules: { ...DEFAULT_RULES }, 
          players: mockPlayers
        }).then(() => { alert('✅ สร้างข้อมูลจำลองสำเร็จ!'); });
      };

      const addPlayer = (e) => {
        e.preventDefault();
        if (!newPlayer.name) return;
        const ev = events[currentEventId];
        const playerRef = db.ref(`events/${currentEventId}/players`).push();
        playerRef.set({
          id: playerRef.key, name: newPlayer.name, gender: newPlayer.gender,
          isSenior: newPlayer.gender === 'Lady' ? false : newPlayer.isSenior, scores: [...ev.pars]
        }).then(() => { setNewPlayer({ name: '', gender: 'Men', isSenior: false }); });
      };

      const updatePlayerInfo = (e) => {
        e.preventDefault();
        db.ref(`events/${currentEventId}/players/${editingPlayer.id}`).update({
          name: editingPlayer.name, gender: editingPlayer.gender, isSenior: editingPlayer.gender === 'Lady' ? false : editingPlayer.isSenior
        }).then(() => { setEditingPlayer(null); });
      };

      const updateScore = (playerId, holeIndex, value) => {
        if (value === '') {
          db.ref(`events/${currentEventId}/players/${playerId}/scores/${holeIndex}`).set('');
          return;
        }
        let val = parseInt(value) || 0;
        if (val > 20) val = 20; 
        db.ref(`events/${currentEventId}/players/${playerId}/scores/${holeIndex}`).set(val);
      };

      const saveRules = (e) => {
        e.preventDefault();
        const finalRules = {};
        for (const key in editingRules) {
          finalRules[key] = parseInt(editingRules[key]) || 0;
        }
        db.ref(`events/${currentEventId}/rules`).set(finalRules).then(() => {
          setShowRulesModal(false);
        });
      };

      const getRankIcon = (rankNum, rankStr) => {
        if (rankNum === 1) return <div className="flex items-center justify-center gap-1"><i className="fas fa-trophy text-[#d4af37] text-sm md:text-xl"></i><span className="text-[10px] md:text-xs font-extrabold text-[#d4af37]">{rankStr}</span></div>;
        if (rankNum === 2) return <div className="flex items-center justify-center gap-1"><i className="fas fa-trophy text-[#a0a0a0] text-sm md:text-xl"></i><span className="text-[10px] md:text-xs font-extrabold text-[#909090]">{rankStr}</span></div>;
        if (rankNum === 3) return <div className="flex items-center justify-center gap-1"><i className="fas fa-trophy text-[#cd7f32] text-sm md:text-xl"></i><span className="text-[10px] md:text-xs font-extrabold text-[#b87333]">{rankStr}</span></div>;
        return rankStr;
      };

      const renderNineHoles = (startIndex, endIndex, title, eventPars, eventRules) => {
        const slicedPars = eventPars.slice(startIndex, endIndex);
        const slicedScores = viewScorecard.scores.slice(startIndex, endIndex);

        const parTotal = slicedPars.reduce((a, b) => a + (parseInt(b) || 0), 0);
        let scoreTotal = 0; let ptsTotal = 0;

        slicedScores.forEach((score, i) => {
          if (score > 0) {
            scoreTotal += parseInt(score);
            ptsTotal += getStablefordPoints(parseInt(score), slicedPars[i], eventRules);
          }
        });

        return (
          <div className="rounded-xl border mb-3 md:mb-4 shadow-sm overflow-hidden bg-white">
            <table className="w-full text-center border-collapse table-fixed">
              <tbody>
                <tr className="bg-emerald-900 text-white">
                  <td className="py-1 md:py-2 border border-emerald-800 font-bold text-[9px] md:text-sm w-[18%] md:w-[15%] leading-tight">{title}</td>
                  {slicedPars.map((_,i) => <td key={i} className="py-1 md:py-2 border border-emerald-800 w-[7.5%] md:w-[8%] text-[10px] md:text-sm">{startIndex + i + 1}</td>)}
                  <td className="py-1 md:py-2 border border-emerald-800 font-bold w-[14.5%] md:w-[13%] bg-emerald-950 text-[#d4af37] text-[10px] md:text-sm">TOT</td>
                </tr>
                <tr className="bg-gray-100 font-bold text-emerald-900">
                  <td className="py-1 md:py-2 border border-gray-300 text-[9px] md:text-sm">Par</td>
                  {slicedPars.map((par, i) => <td key={i} className="py-1 md:py-2 border border-gray-300 text-[11px] md:text-sm">{par}</td>)}
                  <td className="py-1 md:py-2 border border-gray-300 font-bold bg-gray-200 text-[11px] md:text-sm">{parTotal}</td>
                </tr>
                <tr>
                  <td className="py-1 md:py-2 border border-gray-200 font-bold text-[9px] md:text-sm">Score</td>
                  {slicedScores.map((score, i) => <td key={i} className={`py-1 md:py-2 border border-gray-200 font-mono font-bold text-[11px] md:text-base ${score>0 ? (score<slicedPars[i] ? 'text-red-600 bg-red-50' : score>slicedPars[i] ? 'text-blue-600 bg-blue-50' : '') : ''}`}>{score || '-'}</td>)}
                  <td className="py-1 md:py-2 border border-gray-200 font-mono font-bold text-[11px] md:text-base bg-emerald-100/70 text-emerald-950">{scoreTotal > 0 ? scoreTotal : '-'}</td>
                </tr>
                <tr className="bg-[#fdfbf7]">
                  <td className="py-1 md:py-2 border border-[#d4af37]/30 font-bold text-[#9c7e1c] text-[8px] md:text-xs tracking-tight">Stableford</td>
                  {slicedScores.map((score, i) => <td key={i} className="py-1 md:py-2 border border-[#d4af37]/30 font-mono font-bold text-[#d4af37] text-[11px] md:text-sm">{score>0 ? getStablefordPoints(score, slicedPars[i], eventRules) : '-'}</td>)}
                  <td className="py-1 md:py-2 border border-[#d4af37]/40 font-mono font-extrabold text-[#9c7e1c] text-[11px] md:text-sm bg-amber-200/80">{ptsTotal}</td>
                </tr>
              </tbody>
            </table>
          </div>
        );
      };

      const event = currentEventId ? events[currentEventId] : null;
      let displayPlayers = []; let rankedPlayers = []; let adminPlayers = []; let totalPar = 0; let activeRules = DEFAULT_RULES;
      let groupSubtitle = ""; 

      if (event) {
        totalPar = event.pars.reduce((a, b) => a + b, 0);
        activeRules = event.rules || DEFAULT_RULES;
        
        const rawPlayers = event.players ? Object.values(event.players) : [];
        const processedPlayers = rawPlayers.map(p => calculatePlayerStats(p, event.pars, activeRules));
        
        displayPlayers = [...processedPlayers];
        if (activeTab !== 'ALL') displayPlayers = displayPlayers.filter(p => p.group === activeTab);
        displayPlayers.sort(comparePlayers);

        if (activeTab === 'ALL') groupSubtitle = "System 36 Format";
        else if (activeTab === 'A') groupSubtitle = "Handicap 0 - 9";
        else if (activeTab === 'B') groupSubtitle = "Handicap 10 - 18";
        else if (activeTab === 'C') groupSubtitle = "Handicap 19+";

        let currentRankNum = 1;
        rankedPlayers = displayPlayers.map((p, i) => {
          if (p.holesPlayed < 18) return { ...p, rankNum: 999, rankStr: '-' };
          let isTieWithPrev = false; let isTieWithNext = false;
          if (i > 0 && comparePlayers(p, displayPlayers[i-1]) === 0) { isTieWithPrev = true; } else { currentRankNum = i + 1; }
          if (i < displayPlayers.length - 1 && comparePlayers(p, displayPlayers[i+1]) === 0) { isTieWithNext = true; }
          return { ...p, rankNum: currentRankNum, rankStr: (isTieWithPrev || isTieWithNext) ? `T${currentRankNum}` : `${currentRankNum}` };
        });

        adminPlayers = [...processedPlayers];
        if (adminSort.key !== 'default') {
          adminPlayers.sort((a, b) => {
            let valA, valB;
            if (adminSort.key === 'name') { valA = a.name; valB = b.name; }
            else if (adminSort.key === 'tot') { valA = a.grossScore; valB = b.grossScore; }
            else if (adminSort.key.startsWith('H')) { const idx = parseInt(adminSort.key.replace('H', '')) - 1; valA = a.scores[idx] || 0; valB = b.scores[idx] || 0; }
            if (valA < valB) return adminSort.direction === 'asc' ? -1 : 1;
            if (valA > valB) return adminSort.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }
      }

      return (

              {currentEventId ? (
                <button onClick={() => setCurrentEventId(null)} className="text-emerald-300 hover:text-white font-bold whitespace-nowrap text-sm md:text-base flex items-center"><i className="fas fa-arrow-left mr-1 md:mr-2"></i><span className="hidden md:inline">Back</span></button>
              ) : (
                <div className="w-16"></div>

              <div className="flex-grow text-center mx-2 overflow-hidden">
                {currentEventId ? (
                  <h1 className="text-lg md:text-2xl font-bold text-[#fdfbf7] truncate">{event.name}</h1>

                  <div>
                    <i className="fas fa-trophy text-3xl md:text-5xl text-[#d4af37] mb-2"></i>
                    <h1 className="text-2xl md:text-4xl font-bold tracking-wide text-[#fdfbf7]">Golf Tournament</h1>
                  </div>
                )}
              </div>
              
              <div className="flex items-center gap-1 md:gap-2">
                {currentEventId && isAdmin && (
                  <button onClick={() => setAdminViewMode(adminViewMode === 'entry' ? 'leaderboard' : 'entry')} className="text-[10px] md:text-xs bg-amber-500 text-emerald-950 font-bold px-2 md:px-3 py-1.5 rounded-full shadow hover:bg-amber-400 transition-colors whitespace-nowrap">
                    <i className={`fas ${adminViewMode === 'entry' ? 'fas fa-trophy' : 'fas fa-edit'} md:mr-1`}></i><span className="hidden md:inline">{adminViewMode === 'entry' ? 'View Leaderboard' : 'Score Entry'}</span>
                  </button>
                )}
                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)} className="text-[10px] md:text-xs text-emerald-300 hover:text-white bg-emerald-800 px-2 md:px-3 py-1.5 rounded-full transition-colors flex-shrink-0 whitespace-nowrap">
                  <i className={`fas ${isAdmin ? 'fa-sign-out-alt' : 'fa-lock'} md:mr-1`}></i><span className="hidden md:inline">{isAdmin ? 'Exit Admin' : 'Admin Login'}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-1 md:px-4 py-6 md:py-8">
            
            {!currentEventId && (
              <div className="max-w-5xl mx-auto">
                {isAdmin && (
                  <div className="flex flex-col md:flex-row justify-between items-center mb-8 bg-emerald-50 p-4 rounded-xl border border-emerald-100 gap-4">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-emerald-900">วันที่ Mockup:</span>
                      <input type="date" value={mockupDate} onChange={(e) => setMockupDate(e.target.value)} className="border p-2 rounded-lg text-sm bg-white" />
                      <button onClick={generateMockupEvent} className="bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-emerald-800 shadow whitespace-nowrap">
                        <i className="fas fa-magic mr-1"></i> สร้าง Mockup
                      </button>
                    </div>
                    <button onClick={() => setShowCreateModal(true)} className="flex items-center space-x-2 bg-[#d4af37] text-emerald-950 px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-[#b5952f] w-full md:w-auto justify-center">
                      <i className="fas fa-plus"></i><span>สร้างการแข่งขันใหม่</span>
                    </button>
                  </div>
                )}
                <h2 className="text-2xl font-bold text-emerald-900 mb-6 border-b-2 border-emerald-200 pb-2"><i className="fas fa-calendar-check mr-2 text-[#d4af37]"></i> All Tournaments</h2>
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {Object.keys(events).length === 0 ? (
                    <div className="col-span-full text-center p-12 bg-white rounded-xl border border-dashed border-gray-300 text-gray-500">
                      <i className="fas fa-golf-ball text-4xl text-gray-300 mb-3"></i><br/>ไม่มีรายการแข่งขัน สร้างใหม่เพื่อเริ่มต้น
                    </div>
                  ) : Object.values(events).sort((a,b) => new Date(b.date) - new Date(a.date)).map(e => (
                    <div key={e.id} className="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden hover:shadow-xl transition-shadow flex flex-col">
                      <div className="bg-emerald-900 p-4 border-b border-[#d4af37]">
                        <h3 className="text-lg font-bold text-white truncate" title={e.name}>{e.name}</h3>
                        {e.courseName && e.courseName !== e.name && (
                          <p className="text-xs text-emerald-300 truncate mt-1"><i className="fas fa-map-marker-alt mr-1"></i>{e.courseName}</p>
                        )}
                      </div>
                      <div className="p-4 flex-grow space-y-3">
                        <p className="text-sm text-gray-600 font-medium"><i className="fas fa-calendar-alt w-5 text-emerald-700"></i> {e.date ? e.date.split('-').reverse().join('/') : ''}</p>
                        <p className="text-sm text-gray-600 font-medium"><i className="fas fa-users w-5 text-emerald-700"></i> {Object.keys(e.players || {}).length} Players</p>
                      </div>
                      <div className="p-4 bg-gray-50 border-t border-gray-100 flex space-x-2">
                        <button onClick={() => setCurrentEventId(e.id)} className="flex-grow bg-emerald-700 text-white font-bold py-2 rounded-lg hover:bg-emerald-800 shadow">Enter Event</button>
                        {isAdmin && <button onClick={() => { if(window.confirm('Delete Event?')) db.ref(`events/${e.id}`).remove() }} className="bg-red-50 text-red-600 px-3 py-2 rounded-lg border border-red-200 hover:bg-red-100"><i className="fas fa-trash-alt"></i></button>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentEventId && (!isAdmin || adminViewMode === 'leaderboard') && (
              <div>
                <div className="flex justify-center gap-2 mb-6 flex-wrap">
                  {['ALL', 'A', 'B', 'C', 'Senior', 'Lady'].map(tab => (
                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-1.5 md:px-5 md:py-2 rounded-full text-xs md:text-sm font-bold border transition-all ${activeTab === tab ? 'bg-emerald-800 text-white border-emerald-900 shadow-md' : 'bg-white text-emerald-800 border-emerald-200'}`}>
                      {tab === 'ALL' ? 'Overall' : tab === 'Senior' || tab === 'Lady' ? tab : `Group ${tab}`}
                    </button>
                  ))}
                </div>
                
                <div id="leaderboard-capture" className="bg-white rounded-xl shadow-lg overflow-hidden pb-4 border border-gray-200 relative">
                  <div className="bg-emerald-900 text-white p-3 md:p-4 text-center border-b border-[#d4af37] relative">
                    <h2 className="text-base md:text-xl font-bold">{activeTab === 'ALL' ? 'Leaderboard - Overall' : activeTab === 'Senior' || activeTab === 'Lady' ? `Leaderboard - ${activeTab}` : `Leaderboard - Group ${activeTab}`}</h2>
                    
                    {groupSubtitle && (
                      <p className="text-[11px] md:text-sm text-emerald-200 mb-1">{groupSubtitle}</p>
                    )}
                    
                    <button data-html2canvas-ignore onClick={() => { setEditingRules(activeRules); setShowRulesModal(true); }} className="mt-2 inline-flex items-center text-[10px] md:text-xs bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 px-3 py-1 rounded-full border border-emerald-700 transition-colors">
                      <i className="fas fa-info-circle mr-1.5"></i> Scoring Rules {isAdmin ? '(Edit)' : ''}
                    </button>
                    
                    <button onClick={() => captureImage('leaderboard-capture', `${event.name}-Leaderboard-${activeTab}`)} data-html2canvas-ignore className="absolute right-2 md:right-4 bottom-2 md:bottom-4 bg-emerald-700 text-white px-2.5 md:px-3 py-1.5 rounded shadow text-[10px] md:text-xs hover:bg-emerald-600"><i className="fas fa-download mr-1"></i>Save Image</button>
                  </div>
                  
                  {/* ปรับแก้ให้คอลัมน์ Player มีพื้นที่แสดงผลกว้างพอดี ไม่ถูกบีบอัดจนตัวหนังสือซ้อนกันตอน Save ภาพ */}
                  <div className="overflow-x-auto hide-scroll w-full">
                    <table className="w-full text-left text-xs md:text-sm">
                      <thead className="bg-gray-100 text-emerald-900 border-b">
                        <tr>
                          <th className="p-3 md:p-4 text-center whitespace-nowrap">Rank</th>
                          <th className="p-3 md:p-4 min-w-[140px] md:min-w-[200px]">Player</th>
                          <th className="p-3 md:p-4 text-center whitespace-nowrap">Group</th>
                          <th className="p-3 md:p-4 text-center whitespace-nowrap">Gross</th>
                          <th className="p-3 md:p-4 text-center whitespace-nowrap">Stableford</th>
                          <th className="p-3 md:p-4 text-center whitespace-nowrap">HCP</th>
                          <th className="p-3 md:p-4 text-center whitespace-nowrap">NET</th>
                        </tr>
                      </thead>
                      <tbody>
                        {rankedPlayers.map((p) => (
                          <tr key={p.id} onClick={() => setViewScorecard(p)} className="border-b border-gray-100 hover:bg-emerald-50 cursor-pointer">
                            <td className="p-3 md:p-4 text-center font-bold whitespace-nowrap">{p.rankStr === '-' ? '-' : getRankIcon(p.rankNum, p.rankStr)}</td>
                            <td className="p-3 md:p-4 font-bold text-emerald-900 whitespace-nowrap">
                              <div className="flex items-center gap-1.5">
                                <span>{p.name}</span>
                                {p.gender === 'Lady' && <span className="inline-block bg-rose-100 text-rose-700 text-[9px] md:text-xs px-2 py-0.5 rounded-full font-bold flex-shrink-0">Lady</span>} 
                                {p.isSenior && <span className="inline-block bg-amber-100 text-amber-700 text-[9px] md:text-xs px-2 py-0.5 rounded-full font-bold flex-shrink-0">Senior</span>}
                              </div>
                            </td>
                            <td className="p-3 md:p-4 text-center font-bold text-gray-600 whitespace-nowrap">{p.group}</td>
                            <td className="p-3 md:p-4 text-center font-mono font-semibold text-gray-900 whitespace-nowrap">{p.grossScore || '-'}</td>
                            <td className="p-3 md:p-4 text-center font-mono font-bold text-[#d4af37] whitespace-nowrap">{p.stablefordPoints}</td>
                            <td className="p-3 md:p-4 text-center font-mono text-gray-500 whitespace-nowrap">{p.holesPlayed === 18 ? p.handicap : '-'}</td>
                            <td className="p-3 md:p-4 text-center font-mono font-extrabold text-base md:text-lg text-emerald-700 bg-emerald-50/50 whitespace-nowrap">{p.holesPlayed === 18 ? p.netScore : 'Playing'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {currentEventId && isAdmin && adminViewMode === 'entry' && (
              <div>
                <div className="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-gray-200 mb-6">
                  <form onSubmit={addPlayer} className="flex flex-col md:flex-row items-center gap-3 w-full">
                    <input type="text" value={newPlayer.name} onChange={e=>setNewPlayer({...newPlayer, name:e.target.value})} placeholder="ชื่อนักกอล์ฟ" required className="w-full md:w-auto border border-gray-300 rounded-lg p-3 flex-grow bg-gray-50 focus:ring-2 focus:ring-emerald-500 outline-none" />
                    <div className="flex w-full md:w-auto gap-3 items-center">
                        <select value={newPlayer.gender} onChange={e=>setNewPlayer({...newPlayer, gender:e.target.value, isSenior: e.target.value==='Lady'?false:newPlayer.isSenior})} className="border border-gray-300 rounded-lg p-3 bg-gray-50 outline-none flex-grow md:flex-grow-0">
                          <option value="Men">Men</option><option value="Lady">Lady</option>
                        </select>
                        <label className={`flex items-center space-x-2 cursor-pointer ${newPlayer.gender==='Lady'?'opacity-40':''}`}>
                          <input type="checkbox" checked={newPlayer.isSenior} onChange={e=>setNewPlayer({...newPlayer, isSenior:e.target.checked})} disabled={newPlayer.gender==='Lady'} className="rounded w-5 h-5 text-emerald-600 focus:ring-emerald-500" /> <span className="font-bold text-sm">Senior</span>
                        </label>
                    </div>
                    <button type="submit" className="w-full md:w-auto bg-emerald-700 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-emerald-800">Add Player</button>
                  </form>
                </div>

                <div className="bg-white rounded-xl shadow-lg overflow-hidden relative border border-gray-300">
                  <div className="overflow-auto max-h-[600px] relative hide-scroll">
                    <table className="w-full text-center border-collapse">

                <div className="grid grid-cols-4 gap-1.5 md:gap-3 mb-4 md:mb-6 text-center">
                  <div className="bg-gray-50 border p-2 md:p-3 rounded-xl"><p className="text-[10px] md:text-xs font-bold text-gray-500 mb-1">Gross</p><p className="text-xl md:text-3xl font-mono text-gray-900 font-bold">{viewScorecard.grossScore}</p></div>
                  <div className="bg-[#fdfbf7] border border-[#d4af37] p-2 md:p-3 rounded-xl"><p className="text-[10px] md:text-xs font-bold text-[#9c7e1c] mb-1">Stableford</p><p className="text-xl md:text-3xl font-mono text-[#d4af37] font-bold">{viewScorecard.stablefordPoints}</p></div>
                  <div className="bg-gray-50 border p-2 md:p-3 rounded-xl"><p className="text-[10px] md:text-xs font-bold text-gray-500 mb-1">HCP</p><p className="text-xl md:text-3xl font-mono text-gray-600 font-bold">{viewScorecard.holesPlayed === 18 ? viewScorecard.handicap : '-'}</p></div>
                  <div className="bg-emerald-50 border border-emerald-200 p-2 md:p-3 rounded-xl"><p className="text-[10px] md:text-xs font-bold text-emerald-700 mb-1">NET</p><p className="text-xl md:text-3xl font-mono text-emerald-700 font-bold">{viewScorecard.holesPlayed === 18 ? viewScorecard.netScore : '-'}</p></div>
                </div>
                {renderNineHoles(0, 9, 'OUT (1-9)', event.pars, activeRules)}
                {renderNineHoles(9, 18, 'IN (10-18)', event.pars, activeRules)}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
